<body>
<header id="masthead"><div><div id="name">👑 THE CORRIDORS <span id="version">v0.5</span></div><div class="tag">COME FOR THE GAMES. STAY FOR THE CHAOS.</div></div><div class="hudright"><button id="cheese" class="pill" aria-label="Cheese balance">🧀 0</button><button id="menuButton" class="pill" aria-label="Menu">☰</button></div></header>

<canvas id="scene" aria-label="Isometric fantasy castle lobby, with four mystery corridors"></canvas>
<div id="bottomBar"><div id="stickZone" aria-label="Movement joystick"><div id="knob"></div></div><div id="message">Explore the castle • Move with joystick</div><button id="use" disabled>OPEN</button></div>

<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),joy=document.getElementById('stickZone'),knob=document.getElementById('knob'),use=document.getElementById('use'),message=document.getElementById('message'),modal=document.getElementById('modal'),menu=document.getElementById('menu');
const pos={x:1.1,y:1.1},axis={x:0,y:0},keys=new Set();let W=0,H=0,D=1,S=30,ox=0,oy=0,portrait=false,near=null,last=0,active=null,paused=false,trashOpened=0;
const places=[
 {id:'north',x:-5.65,y:-5.65,label:'MYSTERY I',color:'#4beaff',kind:'door',roman:'I'},
 {id:'east',x:5.65,y:-5.65,label:'MYSTERY II',color:'#ce8cff',kind:'door',roman:'II'},
 {id:'south',x:5.65,y:5.65,label:'MYSTERY III',color:'#ff9e49',kind:'door',roman:'III'},
 {id:'west',x:-5.65,y:5.65,label:'MYSTERY IV',color:'#83ffae',kind:'door',roman:'IV'},
 {id:'shop',x:-5.25,y:-.6,label:'SHOP',color:'#ffce77',kind:'feature',symbol:'🛍'},
 {id:'events',x:.6,y:-5.25,label:'EVENTS',color:'#ffa4d3',kind:'feature',symbol:'🎪'},
 {id:'board',x:5.25,y:.6,label:'CHEESEBOARD',color:'#ffe58d',kind:'feature',symbol:'🏆'},
 {id:'daily',x:-.6,y:5.25,label:'DAILY',color:'#87b9ff',kind:'feature',symbol:'📜'},
 {id:'crown',x:0,y:0,label:'THE CROWN',color:'#ffdb86',kind:'crown'},
 {id:'bin1',x:-6.8,y:1.7,label:'GARBAGE CAN',color:'#77deb5',kind:'trash'},
 {id:'bin2',x:1.7,y:-6.8,label:'GARBAGE CAN',color:'#77deb5',kind:'trash'},
 {id:'bin3',x:6.8,y:-1.7,label:'GARBAGE CAN',color:'#77deb5',kind:'trash'},
 {id:'bin4',x:-1.7,y:6.8,label:'GARBAGE CAN',color:'#77deb5',kind:'trash'}];
const bound=7.7,random=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let box=canvas.getBoundingClientRect();W=box.width;H=box.height;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(W*D));canvas.height=Math.max(1,Math.round(H*D));ctx.setTransform(D,0,0,D,0,0);portrait=H>W*1.06;S=portrait?Math.max(26,Math.min(34,W/12)):Math.min((W-230)/30.8,(H-78)/17.4,40);S=Math.max(13,S);camera()}
function camera(){if(portrait){ox=W*.5-(pos.x-pos.y)*S;oy=H*.54-(pos.x+pos.y)*S*.50}else{ox=W*.5;oy=H*.57}}
addEventListener('resize',resize);resize();
function iso(x,y,z=0){return{x:ox+(x-y)*S,y:oy+(x+y)*S*.50-z*S}}
function polygon(coords,fill,stroke='',width=1){ctx.beginPath();coords.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function line(a,b,color,width=2){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function ellipse(x,y,rx,ry,fill,stroke='',width=1){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function text(v,x,y,size=12,color='#fff',weight=900){ctx.save();ctx.font=`${weight} ${size}px system-ui, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.strokeStyle='#10091f';ctx.lineWidth=Math.max(2,size*.25);ctx.strokeText(v,x,y);ctx.fillStyle=color;ctx.fillText(v,x,y);ctx.restore()}
function box3(x,y,width,height,depth,top,side,front){let t=[iso(x,y,depth),iso(x+width,y,depth),iso(x+width,y+height,depth),iso(x,y+height,depth)];let b=t.map(p=>({x:p.x,y:p.y+depth*S}));polygon([t[1],t[2],b[2],b[1]],side);polygon([t[2],t[3],b[3],b[2]],front);polygon(t,top,'#e5c88c55',1)}
function background(){let g=ctx.createRadialGradient(W*.5,H*.47,5,W*.5,H*.52,Math.max(W,H)*.8);g.addColorStop(0,'#4c316e');g.addColorStop(.5,'#24163f');g.addColorStop(1,'#090a1d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d0c1ff';for(let i=0;i<55;i++){let x=((i*131+13)%997)/997*W,y=((i*223+57)%883)/883*H;ctx.globalAlpha=.10+(i%6)*.045;ellipse(x,y,i%3===0?1.1:.6,i%3===0?1.1:.6,'#cfc2ff')}ctx.globalAlpha=1}
function floor(){let a=iso(-bound,-bound),b=iso(bound,-bound),c=iso(bound,bound),d=iso(-bound,bound),depth=S*.53;polygon([{x:a.x,y:a.y+depth},{x:b.x,y:b.y+depth},{x:c.x,y:c.y+depth},{x:d.x,y:d.y+depth}],'#160f28','#000',4);polygon([d,c,{x:c.x,y:c.y+depth},{x:d.x,y:d.y+depth}],'#352140','#d6a96d',2);polygon([b,c,{x:c.x,y:c.y+depth},{x:b.x,y:b.y+depth}],'#3c294f','#cb985f',2);
let grad=ctx.createLinearGradient(0,a.y,0,c.y);grad.addColorStop(0,'#583875');grad.addColorStop(.62,'#352348');grad.addColorStop(1,'#271b3c');polygon([a,b,c,d],grad,'#c69a66',4);
for(let u=-7.5;u<=7.51;u+=.82){let aa=iso(u,-bound),bb=iso(u,bound),cc=iso(-bound,u),dd=iso(bound,u);line(aa,bb,'#bf9ac12a',1);line(cc,dd,'#bda2d02e',1)}
// Four wide clear illuminated stone walkways from the gathering circle.
let paths=[[[-5.7,-5.7],[0,0]],[[5.7,-5.7],[0,0]],[[5.7,5.7],[0,0]],[[-5.7,5.7],[0,0]]];for(const q of paths){let a=iso(...q[0]),b=iso(...q[1]);line(a,b,'#e3bd7b23',S*.63);line(a,b,'#f7dba421',2)}
for(let j=0;j<24;j++){const p=iso(-7.1+j*.59,-7.1),r=iso(-7.1,-7.1+j*.59);ellipse(p.x,p.y,1.8,1.8,'#ffda85aa');ellipse(r.x,r.y,1.8,1.8,'#ffd2ad66')}
}
function tower(x,y,accent='#bd8fff'){let p=iso(x,y);box3(x-.49,y-.49,.98,.98,2.2,'#8b6b9e','#49365f','#59436c');p=iso(x,y,2.45);ellipse(p.x,p.y,S*.76,S*.40,'#30213c','#e7c28b',2);for(let i=-2;i<=2;i++){let a=iso(x+i*.19,y,2.6);ctx.fillStyle='#b19acc';ctx.fillRect(a.x-S*.16,a.y-S*.17,S*.32,S*.35)}ellipse(p.x,p.y+S*.86,S*.14,S*.28,accent)}
function wall(a,b,front){let p=iso(...a),q=iso(...b),height=S*1.75;polygon([p,q,{x:q.x,y:q.y-height},{x:p.x,y:p.y-height}],front,'#b08ba7',2);line({x:p.x,y:p.y-height},{x:q.x,y:q.y-height},'#ffe0a8',3);for(let i=1;i<=10;i++){let f=i/11,x=p.x+(q.x-p.x)*f,y=p.y+(q.y-p.y)*f-height;line({x,y},{x:x+2,y:y+height*.85},'#2a19365b',1.5);if(i%2===0)ellipse(x,y+height*.45,3,7,'#f0bc8152')}for(let i=0;i<=14;i++){let f=i/14,x=p.x+(q.x-p.x)*f,y=p.y+(q.y-p.y)*f-height;ctx.fillStyle=i%2?'#a994ae':'#c6aed1';ctx.fillRect(x-S*.14,y-S*.20,S*.27,S*.20)}}
function fortress(){wall([-bound,-bound],[bound,-bound],'#503764');wall([-bound,-bound],[-bound,bound],'#3e2b55');tower(-bound,-bound,'#ffd08f');tower(bound,-bound,'#d89cff');tower(-bound,bound,'#8ae9d8');
// Banners above the stone walls.
for(const [x,y,col] of [[-5.4,-7.65,'#47d8f0'],[-1.7,-7.65,'#e5a3ff'],[2.2,-7.65,'#ffb57c'],[-7.65,2.0,'#9cfc9b']]){let p=iso(x,y,1.5);polygon([{x:p.x-6,y:p.y},{x:p.x+6,y:p.y},{x:p.x+6,y:p.y+23},{x:p.x,y:p.y+17},{x:p.x-6,y:p.y+23}],col,'#f0c98d',1.2)}}
function rune(x,y,color,size=.62){let p=iso(x,y);ctx.save();ctx.shadowColor=color;ctx.shadowBlur=12;polygon([{x:p.x,y:p.y-S*size*.5},{x:p.x+S*size,y:p.y},{x:p.x,y:p.y+S*size*.5},{x:p.x-S*size,y:p.y}],'#251638',color,2.5);ctx.restore()}
function portal(p){let a=iso(p.x,p.y),r=S*.55,highlight=near&&near.id===p.id;ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=highlight?26:17;ellipse(a.x,a.y-S*.7,r*.86,r*1.32,p.color);ctx.restore();
// Gothic arch and stone buttresses.
for(const shift of [-1,1]){let x=a.x+shift*r*.84;polygon([{x:x-5,y:a.y+3},{x:x+5,y:a.y+3},{x:x+6,y:a.y-S*1.4},{x:x-6,y:a.y-S*1.4}],'#95819e','#f8d59b',1);ellipse(x,a.y-S*1.49,8,5,'#e6c69c')}
ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=highlight?32:15;ctx.beginPath();ctx.moveTo(a.x-r*.70,a.y);ctx.lineTo(a.x-r*.70,a.y-S*1.10);ctx.quadraticCurveTo(a.x-r*.48,a.y-S*1.89,a.x,a.y-S*1.98);ctx.quadraticCurveTo(a.x+r*.48,a.y-S*1.89,a.x+r*.70,a.y-S*1.10);ctx.lineTo(a.x+r*.70,a.y);ctx.closePath();ctx.fillStyle=p.color;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#ffe6b9';ctx.stroke();ctx.restore();ctx.beginPath();ctx.moveTo(a.x-r*.49,a.y-1);ctx.lineTo(a.x-r*.49,a.y-S*1.12);ctx.quadraticCurveTo(a.x-r*.35,a.y-S*1.68,a.x,a.y-S*1.77);ctx.quadraticCurveTo(a.x+r*.35,a.y-S*1.68,a.x+r*.49,a.y-S*1.12);ctx.lineTo(a.x+r*.49,a.y-1);ctx.closePath();let g=ctx.createLinearGradient(a.x,a.y-S*1.6,a.x,a.y);g.addColorStop(0,'#130d2a');g.addColorStop(1,'#100921');ctx.fillStyle=g;ctx.fill();ellipse(a.x,a.y-S*.75,r*.3,r*.48,p.color);text('?',a.x,a.y-S*.87,Math.max(15,S*.7),'#fff1ce');
// Only roman numerals identify doors, not destinations.
text(p.roman,a.x,a.y-S*2.38,Math.max(11,S*.34),'#ffe4b3');rune(p.x,p.y,p.color,.63)}
function stall(p){let a=iso(p.x,p.y),highlight=near&&near.id===p.id;ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=highlight?22:9;rune(p.x,p.y,p.color,.47);ctx.restore();let width=S*.67;polygon([{x:a.x-width,y:a.y-5},{x:a.x+width,y:a.y-5},{x:a.x+width*.79,y:a.y-S*.62},{x:a.x-width*.79,y:a.y-S*.62}],'#795783','#efcf96',1.6);ctx.fillStyle='#a387ae';ctx.fillRect(a.x-width*.67,a.y-S*.60,width*1.34,S*.46);polygon([{x:a.x-width*.95,y:a.y-S*.66},{x:a.x,y:a.y-S*1.48},{x:a.x+width*.95,y:a.y-S*.66}],p.id==='shop'?'#db8255':p.id==='events'?'#a956a7':p.id==='board'?'#b4a050':'#548fc3','#f2dca6',2);text(p.symbol,a.x,a.y-S*.80,Math.max(14,S*.55));text(p.label,a.x,a.y-S*1.80,Math.max(10,S*.30),p.color)}
function bin(p){let a=iso(p.x,p.y);ellipse(a.x,a.y+3,S*.44,S*.19,'#110d1e8f');polygon([{x:a.x-9,y:a.y-4},{x:a.x+9,y:a.y-4},{x:a.x+7,y:a.y-22},{x:a.x-7,y:a.y-22}],'#487f81','#94dcc1',1.3);ellipse(a.x,a.y-23,12,4,'#b2f6ca','#447665',1);text('♻',a.x,a.y-13,10,'#f9eaba');if(near===p)text('🦝',a.x,a.y-43,15)}
function crown(){let a=iso(0,0);ctx.save();ctx.shadowColor='#ffd477';ctx.shadowBlur=22;ellipse(a.x,a.y,S*1.65,S*.83,'#8d5897','#f6d08a',S*.14);ctx.restore();ellipse(a.x,a.y,S*1.37,S*.68,'#412660','#bd8bfb',2);ellipse(a.x,a.y,S*.97,S*.46,'#513176','#e9c57e',2);text('♛',a.x,a.y-S*.06,Math.max(27,S*1.08),'#ffe6a7');}
function avatar(){let a=iso(pos.x,pos.y);ellipse(a.x,a.y+3,12,5,'#0e092c9b');ctx.save();ctx.shadowColor='#63dcff';ctx.shadowBlur=13;polygon([{x:a.x-8,y:a.y-13},{x:a.x+8,y:a.y-13},{x:a.x+10,y:a.y-35},{x:a.x-10,y:a.y-35}],'#3bd1f4','#b9f6ff',1);ctx.restore();ctx.fillStyle='#222146';ctx.fillRect(a.x-7,a.y-10,5,9);ctx.fillRect(a.x+3,a.y-10,5,9);ellipse(a.x,a.y-43,10,12,'#ffdec1','#b78874',1.2);ellipse(a.x-3,a.y-44,1,1,'#24192d');ellipse(a.x+3,a.y-44,1,1,'#24192d');polygon([{x:a.x-10,y:a.y-51},{x:a.x-5,y:a.y-58},{x:a.x,y:a.y-53},{x:a.x+6,y:a.y-59},{x:a.x+11,y:a.y-51}],'#442b5a','#332047',1);text('YOU',a.x,a.y-65,11,'#fff4cd')}
function draw(){ctx.clearRect(0,0,W,H);camera();background();floor();fortress();crown();const items=places.filter(p=>p.kind!=='crown').sort((p,q)=>(p.x+p.y)-(q.x+q.y));let drawn=false;for(const p of items){if(!drawn&&(p.x+p.y)>(pos.x+pos.y)){avatar();drawn=true}if(p.kind==='door')portal(p);else if(p.kind==='feature')stall(p);else if(p.kind==='trash')bin(p)}if(!drawn)avatar();
// Little fixed orientation sign: the four door positions are discoverable by exploration.
if(portrait){text('✦ Explore all four sides ✦',W*.5,H-18,11,'#ffe2a3')}}
function step(t){if(!last)last=t;const dt=Math.min((t-last)/1000,.05);last=t;if(!paused){let x=axis.x+Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));let y=axis.y+Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));let n=Math.hypot(x,y);if(n>.05){x/=Math.max(1,n);y/=Math.max(1,n);const nx=pos.x+(x+y)*.707*3.7*dt,ny=pos.y+(y-x)*.707*3.7*dt;if(Math.abs(nx)<bound-.25&&Math.abs(ny)<bound-.25){pos.x=nx;pos.y=ny}}let closest=null,dist=Infinity;for(const p of places){let d=Math.hypot(pos.x-p.x,pos.y-p.y);if(d<1.58&&d<dist){closest=p;dist=d}}near=closest;use.disabled=!near;use.textContent=near&&near.kind==='door'?'OPEN':near?'USE':'OPEN';message.textContent=near?near.kind==='door'?'🚪 Mystery door · Tap OPEN':`✦ ${near.label} · Tap USE`:'Explore the castle · Follow the glowing paths'}draw();requestAnimationFrame(step)}requestAnimationFrame(step);
function joyMove(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.hypot(dx,dy),max=r.width*.33,f=Math.min(len,max)/(len||1);axis.x=dx*f/max;axis.y=dy*f/max;knob.style.transform=`translate(calc(-50% + ${dx*f}px),calc(-50% + ${dy*f}px))`}
function joyReset(){active=null;axis.x=axis.y=0;knob.style.transform='translate(-50%,-50%)'}joy.addEventListener('pointerdown',e=>{e.preventDefault();active=e.pointerId;joy.setPointerCapture(active);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===active)joyMove(e)});for(const name of ['pointerup','pointercancel','lostpointercapture'])joy.addEventListener(name,e=>{if(active===e.pointerId)joyReset()});addEventListener('blur',()=>{joyReset();keys.clear()});addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='Enter'||e.key===' ')interact();if(e.key==='Escape')close()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function show(title,html){paused=true;joyReset();document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;modal.classList.add('show')}
function close(){modal.classList.remove('show');paused=false}document.getElementById('back').addEventListener('click',close);
const panels={shop:['🛍️ The Shop','<p>Cosmetics, bookmarks, and lobby extras will be purchasable with Cheese when the economy is connected.</p><div class="item"><strong>🎩 Cosmetics</strong><br>Prototype catalogue preview.</div><div class="item"><strong>🔖 Bookmark a game</strong><br>Proposed: 1,000 Cheese.</div><div class="item"><strong>🏰 Private Lobby Pass</strong><br>Proposed: 1,000 Cheese / 30 days.</div>'],events:['🎪 Events','<p>Special celebrations, limited-time corridors, and community chaos are planned.</p><div class="item">✨ Upcoming events will appear here.</div><p class="small">No live event server is connected.</p>'],board:['🏆 All-Time Cheeseboard','<p>The all-time Cheese leaderboard will live here.</p><div class="item">🥇 The first legends are still waiting...</div><p class="small">Placeholder only. No accounts or leaderboard data yet.</p>'],daily:['📜 Daily Challenges','<p>Daily challenges will encourage exploring, playing, and creating.</p><div class="item">🚪 Explore a mystery corridor</div><div class="item">🦝 Visit a garbage can</div><p class="small">No daily resets or rewards are active in this demo.</p>'],crown:['👑 The Crown','<p>Welcome to the heart of the lobby — the gathering circle.</p><div class="item"><strong>🧀 Cheese Room hatch</strong><br>Locked until you discover its legendary room in the full game.</div><p class="small">There are only four corridors. The hatch is beneath the crown, not a fifth corridor.</p>']};
function interact(){if(paused||!near)return;if(near.kind==='door'){let troll=random()<.16;let gags=['Back to the Lobby, Kid!','Say Cheese!','THIS CLOSE!!','NOT YOU!','Trash Panda 1, Kid 0'];if(troll){show('🦝 TRASH PANDA!',`<p>${gags[Math.floor(random()*gags.length)]}</p><p>He got you this time.</p><p class="small">Demo troll event only. Legendary roll and cooldown are not implemented.</p>`)}else{show('🚪 MYSTERY OPENED','<p>The door bursts into swirling light!</p><p>🎲 The complete game will reveal a randomly eligible game or rare discovery.</p><p class="small">Prototype only: no connected minigame, routing, real randomness weights, or account-tied cooldown yet.</p>')}return}if(near.kind==='trash'){trashOpened++;show('🦝 TRASH PANDA',trashOpened%3===0?'<p>Trash Panda pops out in brass goggles, a red scarf, and his ridiculous little crown.</p><p>“WHO TOUCHED MY GARBAGE?!”</p>':'<p>The garbage can rattles... a pair of eyes peeks out, then disappears.</p><p class="small">Keep an eye on those bins.</p>');return}let v=panels[near.id];if(v)show(...v)}use.addEventListener('click',interact);
document.getElementById('cheese').addEventListener('click',()=>show('🧀 Your Cheese','<p>Balance: <strong>0 Cheese</strong></p><p class="small">This is a prototype display. Cheese earning and saving are not active.</p>'));
document.getElementById('menuButton').addEventListener('click',()=>menu.classList.toggle('show'));menu.addEventListener('click',e=>{let id=e.target.dataset.menu;if(!id)return;menu.classList.remove('show');if(id==='profile')show('👤 Player Profile','<p>Guest explorer — single-player local prototype.</p><p class="small">Accounts and saved progress are not connected.</p>');if(id==='social')show('👥 Social Lobby','<p>The full lobby is planned for up to eight players per game, including AI.</p><p class="small">This build has no multiplayer networking.</p>');if(id==='controls')show('🎮 Controls','<p>Move the joystick on iPhone, or use WASD / arrow keys on desktop.</p><p>Walk near a door, station, Crown, or garbage can, then tap OPEN or USE.</p><p class="small">Keyboard: Enter to interact, Escape to close.</p>')});
})();
