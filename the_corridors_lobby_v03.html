</style></head><body><main id="game"><div id="hud"><div class="pill">👑 THE CORRIDORS <span style="color:#ffd75a">v0.3</span></div><div class="pill">🧀 0</div></div><div id="tip">Drag the joystick to walk to a corridor</div><div id="worldArea"><div id="world"><svg viewBox="0 0 500 600" preserveAspectRatio="xMidYMid meet" aria-label="Fantasy castle lobby"><defs><linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65469b"/><stop offset="1" stop-color="#24173d"/></linearGradient><pattern id="tiles" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#b48ae0" stroke-opacity=".38" stroke-width="2"/></pattern></defs><path d="M250 12L495 155V440L250 585 5 440V155Z" fill="url(#floor)" stroke="#e5a84c" stroke-width="8"/><path d="M250 12L495 155V440L250 585 5 440V155Z" fill="url(#tiles)"/><path d="M40 142L250 25 460 142" stroke="#9f66e7" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M50 148L250 36 450 148" stroke="#ffce67" stroke-width="3" fill="none"/><ellipse cx="250" cy="340" rx="86" ry="45" fill="#4b267b" stroke="#f6b841" stroke-width="10"/><ellipse cx="250" cy="340" rx="61" ry="29" fill="#7b3bb4" stroke="#d37aff" stroke-width="4"/><text x="250" y="354" font-size="55" text-anchor="middle">👑</text><text x="250" y="402" font-size="17" text-anchor="middle" font-weight="900" fill="#ffe49a">THE CROWN</text><text x="250" y="93" font-size="18" text-anchor="middle" font-weight="900" fill="#ffdf85">FOUR MYSTERY CORRIDORS</text><text x="250" y="470" font-size="30" text-anchor="middle">🧀 🦝 🧀</text></svg><div id="portals"><div class="portal" id="p0" style="--glow:#21e778"><span>💨</span>FART<br>BUBBLES</div><div class="portal" id="p1" style="--glow:#ffae28"><span>🧀</span>THE<br>BANKER</div><div class="portal" id="p2" style="--glow:#28caff"><span>🏎️</span>NACHO<br>RUSH</div><div class="portal" id="p3" style="--glow:#c75bff"><span>❔</span>MYSTERY</div></div><div id="avatar">🧍</div></div></div><div id="status"> (function(){'use strict';var avatar=document.getElementById('avatar'),status=document.getElementById('status'),dialog=document.getElementById('dialog'),joy=document.getElementById('joystick'),stick=document.getElementById('stick');var pos={x:50,y:74},axis={x:0,y:0},keys={},last=0,active=false,pointerId=null;var portals=[{x:13,y:30,title:'FART BUBBLES 💨'},{x:37,y:20,title:'THE BANKER 🧀'},{x:63,y:20,title:'NACHO RUSH 🏎️'},{x:87,y:30,title:'MYSTERY CORRIDOR ❔'}];function closest(){var best=-1,d=1e9;for(var i=0;i<4;i++){var dx=pos.x-portals[i].x,dy=pos.y-portals[i].y,nd=Math.hypot(dx,dy);if(nd<d){d=nd;best=i}}return d<22?best:-1}function update(){avatar.style.left=pos.x+'%';avatar.style.top=pos.y+'%';var n=closest();for(var i=0;i<4;i++)document.getElementById('p'+i).classList.toggle('selected',i===n);status.textContent=n>=0?'Press ENTER: '+portals[n].title:'Drag the purple joystick to walk'}function step(t){if(!last)last=t;var dt=Math.min((t-last)/1000,.05);last=t;if(dialog.style.display!=='flex'){var x=axis.x+(keys.right?1:0)-(keys.left?1:0),y=axis.y+(keys.down?1:0)-(keys.up?1:0),len=Math.hypot(x,y);if(len>0.07){var factor=Math.min(len,1)/len;pos.x=Math.max(10,Math.min(90,pos.x+x*factor*35*dt));pos.y=Math.max(17,Math.min(84,pos.y+y*factor*38*dt))}update()}requestAnimationFrame(step)}function move(clientX,clientY){var r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=clientX-cx,dy=clientY-cy,range=r.width*.34,len=Math.hypot(dx,dy);var scale=len>range?range/len:1;dx*=scale;dy*=scale;axis.x=dx/range;axis.y=dy/range;stick.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))'}function reset(){active=false;pointerId=null;axis.x=axis.y=0;stick.style.transform='translate(-50%,-50%)'}joy.addEventListener('pointerdown',function(e){e.preventDefault();active=true;pointerId=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch(_){}move(e.clientX,e.clientY)});joy.addEventListener('pointermove',function(e){if(active&&e.pointerId===pointerId){e.preventDefault();move(e.clientX,e.clientY)}});joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);joy.addEventListener('lostpointercapture',reset);window.addEventListener('blur',reset);var km={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};addEventListener('keydown',function(e){var k=km[e.key];if(k){keys[k]=true;e.preventDefault()}if(e.key==='Enter'||e.key===' '){enter();e.preventDefault()}});addEventListener('keyup',function(e){var k=km[e.key];if(k)keys[k]=false});function enter(){if(dialog.style.display==='flex'){dialog.style.display='none';return}var n=closest();if(n<0){status.textContent='Move closer to a glowing corridor first!';return}document.getElementById('title').textContent=portals[n].title;document.getElementById('description').textContent='You reached the portal! The playable mini-game will be added after lobby movement works.';dialog.style.display='flex';reset()}document.getElementById('enter').addEventListener('click',enter);document.getElementById('back').addEventListener('click',function(){dialog.style.display='none'});update();requestAnimationFrame(step)})();
</script></body></html>
