<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The Corridors — Playable Lobby</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#0c0820;color:white;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh}.hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}.logo{font-weight:900;font-size:19px;text-shadow:0 2px 7px #000}.tag{font-size:10px;color:#c9a4f5}.money{background:#281735df;border:1px solid #f5c66d;border-radius:16px;padding:10px;color:#ffe28a;font-weight:800}.stick{position:absolute;left:24px;bottom:35px;width:120px;height:120px;border:2px solid #a68bc4;border-radius:50%;background:#ffffff1c}.knob{position:absolute;left:36px;top:36px;width:44px;height:44px;background:#c79dff;border:2px solid white;border-radius:50%;box-shadow:0 0 18px #a96eff}.action{position:absolute;right:24px;bottom:50px;width:88px;height:88px;border:2px solid #ffe49c;border-radius:50%;background:#763e9c;color:white;font-weight:900}.action:disabled{opacity:.35}.tip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#1a1034dc;border-radius:12px;padding:5px 10px;font-size:11px;white-space:nowrap}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#080412d9;padding:20px}.overlay.show{display:flex}.panel{background:#28163f;border:2px solid #ce9cff;border-radius:18px;padding:25px;max-width:420px;text-align:center;box-shadow:0 0 40px #a85dff77}.panel h2{color:#ffe2a1}.panel button{background:#ffd277;border:0;border-radius:10px;padding:13px 22px;font-weight:800}
#preview-world{position:absolute;inset:12% 0 8%;display:flex;align-items:center;justify-content:center;pointer-events:none}#preview-world svg{width:100%;height:100%;max-width:1100px}canvas{position:absolute;inset:0;background:transparent}body.game-running #preview-world{display:none}</style></head><body><div id="preview-world" aria-label="The Corridors lobby preview"><svg viewBox="0 0 900 760" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="floor" x2="1" y2="1"><stop stop-color="#55307d"/><stop offset="1" stop-color="#24123c"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="M450 115 L835 380 L450 655 L65 380 Z" fill="url(#floor)" stroke="#b67ce8" stroke-width="5"/><path d="M65 380L450 655L835 380M450 115L450 655M255 245L640 520M640 245L255 520" fill="none" stroke="#9b69c5" opacity=".35" stroke-width="3"/><g text-anchor="middle" font-family="system-ui" font-weight="800" fill="white" font-size="20"><g filter="url(#glow)"><ellipse cx="205" cy="245" rx="42" ry="64" fill="#1f1138" stroke="#4ce4ff" stroke-width="8"/><ellipse cx="360" cy="165" rx="42" ry="64" fill="#1f1138" stroke="#d58aff" stroke-width="8"/><ellipse cx="540" cy="165" rx="42" ry="64" fill="#1f1138" stroke="#ffac57" stroke-width="8"/><ellipse cx="695" cy="245" rx="42" ry="64" fill="#1f1138" stroke="#8cffae" stroke-width="8"/></g><text x="205" y="160">I</text><text x="360" y="85">II</text><text x="540" y="85">III</text><text x="695" y="160">IV</text><g fill="#ffe18b" stroke="#ffcd65" stroke-width="3"><path d="M415 390L420 355L438 370L450 340L462 370L480 355L485 390Z"/></g><text x="450" y="422" fill="#ffe18b">THE CROWN</text><text x="205" y="505">SHOP</text><text x="695" y="505">CHEESEBOARD</text><text x="280" y="602" font-size="15">DAILY CHALLENGES</text><text x="620" y="602" font-size="15">EVENTS</text><circle cx="450" cy="475" r="19" fill="#58e7ff"/><circle cx="450" cy="445" r="12" fill="#ffe1c1"/><text x="450" y="520" font-size="16">YOU</text></g></svg></div><canvas id="game"></canvas><div class="hud"><div><div class="logo">THE CORRIDORS</div><div class="tag">COME FOR THE GAMES. STAY FOR THE CHAOS.</div></div><div class="money">🧀 0</div></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="action" id="action" disabled>ENTER</button><div class="tip" id="tip">Joystick to move • Approach a location</div><div class="overlay" id="overlay"><div class="panel"><h2 id="title"></h2><p id="description"></p><button id="back">BACK TO LOBBY</button></div></div><script>
(()=>{const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),stick=document.getElementById('stick'),knob=document.getElementById('knob'),action=document.getElementById('action'),tip=document.getElementById('tip'),overlay=document.getElementById('overlay');let W,H,S,last=performance.now(),near=null,paused=false;const pos={x:0,y:1.5},axis={x:0,y:0},keys=new Set();const places=[{x:-4.8,y:-3.5,name:'CORRIDOR I',color:'#45dfff',desc:'The first mystery awaits.'},{x:-1.6,y:-4.6,name:'CORRIDOR II',color:'#d48aff',desc:'A mystery game will live here.'},{x:1.6,y:-4.6,name:'CORRIDOR III',color:'#ffad5e',desc:'A new challenge is coming.'},{x:4.8,y:-3.5,name:'CORRIDOR IV',color:'#8fff9d',desc:'Four corridors. Infinite chaos.'},{x:-5,y:2.7,name:'SHOP',color:'#ffe079',desc:'Spend Cheese on rewards.'},{x:5,y:2.7,name:'CHEESEBOARD',color:'#ffe079',desc:'The leaderboard is coming.'},{x:-3.5,y:4.6,name:'DAILY CHALLENGES',color:'#75bfff',desc:'New challenges every day.'},{x:3.5,y:4.6,name:'EVENTS',color:'#ff91d7',desc:'Special events are coming.'},{x:0,y:0,name:'THE CROWN',color:'#ffe18a',desc:'The heart of The Corridors. What is hidden beneath?'}];function resize(){W=innerWidth;H=innerHeight;let d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W/16,H/12,54)}addEventListener('resize',resize);resize();function iso(x,y){return{x:W/2+(x-y)*S*.8,y:H*.44+(x+y)*S*.4}}function line(a,b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function diamond(x,y,r,fill,stroke){ctx.beginPath();ctx.moveTo(x,y-r*.5);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r*.5);ctx.lineTo(x-r,y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.stroke()}function draw(){document.body.classList.add('game-running');let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#100c29');g.addColorStop(1,'#3d1956');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.lineWidth=1;ctx.strokeStyle='#a178c440';for(let n=-9;n<=9;n++){line(iso(n,-9),iso(n,9));line(iso(-9,n),iso(9,n))}let center=iso(0,0);diamond(center.x,center.y,S*10,'#3b255b44','#ac74d0');for(let p of places){let a=iso(p.x,p.y);ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=near===p?32:17;diamond(a.x,a.y+9,S*.68,'#170f2a',p.color);ctx.beginPath();ctx.ellipse(a.x,a.y-19,S*.25,S*.55,0,0,Math.PI*2);ctx.fillStyle=p.color+'55';ctx.fill();ctx.strokeStyle=p.color;ctx.lineWidth=4;ctx.stroke();ctx.restore();ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold '+Math.max(9,Math.min(13,S*.22))+'px system-ui';ctx.shadowColor='black';ctx.shadowBlur=5;ctx.fillText(p.name,a.x,a.y-30-S*.4);ctx.shadowBlur=0}let a=iso(pos.x,pos.y);ctx.save();ctx.shadowColor='#6ff4ff';ctx.shadowBlur=17;ctx.fillStyle='#43e7ff';ctx.beginPath();ctx.ellipse(a.x,a.y-12,10,17,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe1c1';ctx.beginPath();ctx.arc(a.x,a.y-33,9,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='white';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('YOU',a.x,a.y-50)}function tick(now){let dt=Math.min((now-last)/1000,.05);last=now;if(!paused){let x=axis.x,y=axis.y;if(keys.has('a')||keys.has('arrowleft'))x--;if(keys.has('d')||keys.has('arrowright'))x++;if(keys.has('w')||keys.has('arrowup'))y--;if(keys.has('s')||keys.has('arrowdown'))y++;let mag=Math.hypot(x,y);if(mag){x/=Math.max(1,mag);y/=Math.max(1,mag);let nx=pos.x+(x+y)*.707*dt*3,ny=pos.y+(y-x)*.707*dt*3;if(Math.abs(nx)<7&&Math.abs(ny)<7&&!places.some(p=>Math.hypot(nx-p.x,ny-p.y)<.7)){pos.x=nx;pos.y=ny}}near=places.find(p=>Math.hypot(pos.x-p.x,pos.y-p.y)<1.5)||null;action.disabled=!near;action.textContent=near?'OPEN':'ENTER';tip.textContent=near?'Open '+near.name:'Joystick to move • Approach a location'}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);let active=null;function move(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.hypot(x,y),f=Math.min(m,38)/(m||1);axis.x=x*f/38;axis.y=y*f/38;knob.style.transform='translate('+x*f+'px,'+y*f+'px)'}stick.addEventListener('pointerdown',e=>{active=e.pointerId;stick.setPointerCapture(active);move(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===active)move(e)});function end(e){if(e.pointerId!==active)return;active=null;axis.x=axis.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);function open(){if(!near)return;paused=true;document.getElementById('title').textContent=near.name;document.getElementById('description').textContent=near.desc;overlay.classList.add('show')}action.addEventListener('click',open);document.getElementById('back').addEventListener('click',()=>{paused=false;overlay.classList.remove('show')});addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='Enter')open()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()))})();
</script></body></html>
