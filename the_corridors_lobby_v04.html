<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><title>The Corridors | Lobby v0.4</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09091d;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}button{font:inherit;cursor:pointer}#hud{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:start;justify-content:space-between;gap:8px;pointer-events:none}.brand{font-weight:1000;letter-spacing:.08em;font-size:clamp(15px,3.6vw,23px);text-shadow:0 3px 8px #000}.subtitle{font-size:clamp(8px,1.9vw,11px);color:#fbd999;letter-spacing:.05em}.hudright{display:flex;gap:7px;align-items:center}.pill{border:1px solid #d9b67c;border-radius:18px;background:#26183de9;padding:9px 12px;box-shadow:0 3px 16px #0008;font-weight:800;white-space:nowrap;font-size:13px}.hudbtn{pointer-events:auto;color:#fff}.hint{position:fixed;z-index:5;top:calc(max(8px,env(safe-area-inset-top)) + 58px);left:8px;right:8px;text-align:center;color:#f7e5b4;font-size:12px;text-shadow:0 2px 6px #000;font-weight:700;pointer-events:none}.controls{position:fixed;z-index:8;bottom:calc(12px + env(safe-area-inset-bottom));left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}#joy{width:116px;height:116px;border-radius:50%;border:3px solid #ad85ff;background:#39235f9c;box-shadow:inset 0 0 22px #b08aff55,0 0 20px #805aff55;position:relative;pointer-events:auto;touch-action:none}#joy:before{content:'';position:absolute;inset:15px;border:1px solid #bca2f777;border-radius:50%}#knob{position:absolute;left:50%;top:50%;width:49px;height:49px;border:3px solid #fff1ff;border-radius:50%;background:radial-gradient(circle at 30% 25%,#e8d2ff,#8a4be0);transform:translate(-50%,-50%);box-shadow:0 4px 12px #0009;pointer-events:none}#action{pointer-events:auto;width:90px;height:90px;border-radius:50%;border:4px solid #f9d787;color:#fff;background:linear-gradient(145deg,#9a55cb,#5a248c);box-shadow:0 0 22px #f5bc6690 </style></head><body><canvas id="scene" aria-label="Playable fantasy castle lobby"></canvas><div id="hud"><div><div class="brand">👑 THE CORRIDORS <span style="font-size:11px;color:#f8cf79">v0.4</span></div><div class="subtitle">COME FOR THE GAMES. STAY FOR THE CHAOS.</div></div><div class="hudright"><div class="pill" id="cheese">🧀 0</div><button class="pill hudbtn" id="profile">☰</button></div></div><div class="hint">Four doors. No previews. Your adventure is a surprise.</div><div id="menu"><button data-menu="profile">👤 Profile</button><button data-menu="social">👥 Social</button><button data-menu="help">❔ Controls</button></div><div class="controls"><div id="joy" aria-label="Movement joystick"><div id="knob"></div></div><button id="action" disabled>OPEN</button></div><div id="toast">Move with the joystick • WASD / arrows on desktop</div><div id="modal" role="dialog" aria-modal="true"><div class="panel"><h2 id="modalTitle"></h2><div id="modalBody"></div><button id="close">BACK TO LOBBY</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),joy=document.getElementById('joy'),knob=document.getElementById('knob'),action=document.getElementById('action'),toast=document.getElementById('toast'),modal=document.getElementById('modal'),menu=document.getElementById('menu');let W=0,H=0,D=1,S=1,ox=0,oy=0,last=0,near=null,paused=false,active=null;const pos={x:0,y:3.2},axis={x:0,y:0},keys=new Set();const locations=[{id:'door1',x:-5.5,y:-4.8,label:'MYSTERY I',color:'#46e8fa',kind:'door'},{id:'door2',x:-2,y:-6.2,label:'MYSTERY II',color:'#b98aff',kind:'door'},{id:'door3',x:2,y:-6.2,label:'MYSTERY III',color:'#ff9e4f',kind:'door'},{id:'door4',x:5.5,y:-4.8,label:'MYSTERY IV',color:'#8fffc1',kind:'door'},{id:'shop',x:-5.8,y:2.8,label:'SHOP',color:'#ffc46e',kind:'feature'},{id:'board',x:5.8,y:2.8,label:'CHEESEBOARD',color:'#fce57b',kind:'feature'},{id:'daily',x:-4.5,y:5.3,label:'DAILY CHALLENGES',color:'#86b9ff',kind:'feature'},{id:'events',x:4.5,y:5.3,label:'EVENTS',color:'#ff91ce',kind:'feature'},{id:'crown',x:0,y:0,label:'THE CROWN',color:'#ffdc7a',kind:'crown'},{id:'trash1',x:-7.1,y:-.4,label:'GARBAGE CAN',color:'#8ae4b7',kind:'trash'},{id:'trash2',x:7.1,y:-.4,label:'GARBAGE CAN',color:'#8ae4b7',kind:'trash'},{id:'trash3',x:-7,y:6.1,label:'GARBAGE CAN',color:'#8ae4b7',kind:'trash'},{id:'trash4',x:7,y:6.1,label:'GARBAGE CAN',color:'#8ae4b7',kind:'trash'}];let opened=0,trashOpened=0;const rand=()=>Math.random();function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);S=Math.min(W/21,H/18,48);ox=W*.5;oy=H*.46}addEventListener('resize',resize);resize();function iso(x,y){return{x:ox+(x-y)*S*.82,y:oy+(x+y)*S*.42}}function path(points,fill,stroke,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}function diamond(x,y,r,fill,stroke){path([{x,y:y-r*.5},{x:x+r,y},{x,y:y+r*.5},{x:x-r,y}],fill,stroke,2)}function label(text,x,y,size=11,color='#fff'){ctx.textAlign='center';ctx.font=`900 ${size}px system-ui`;ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.fillStyle=color;ctx.fillText(text,x,y);ctx.shadowBlur=0}function wall(a,b,color){const p=iso(a.x,a.y),q=iso(b.x,b.y),height=S*1.25;path([p,q,{x:q.x,y:q.y-height},{x:p.x,y:p.y-height}],color,'#b88ed0',2);ctx.strokeStyle='#e7bd7c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y-height);ctx.lineTo(q.x,q.y-height);ctx.stroke()}function portal(p){const a=iso(p.x,p.y),r=S*.7;ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=near===p?32:18;diamond(a.x,a.y+9,r*1.3,'#1b1036',p.color);ctx.fillStyle='#342348';ctx.fillRect(a.x-r*.83,a.y-r*1.8,r*1.66,r*1.7);ctx.fillStyle=p.color;ctx.beginPath();ctx.ellipse(a.x,a.y-r*.94,r*.67,r*1.05,0,Math.PI,0);ctx.lineTo(a.x+r*.67,a.y);ctx.lineTo(a.x-r*.67,a.y);ctx.closePath();ctx.fill();ctx.fillStyle='#1a1034';ctx.beginPath();ctx.ellipse(a.x,a.y-r*.86,r*.43,r*.79,0,Math.PI,0);ctx.lineTo(a.x+r*.43,a.y);ctx.lineTo(a.x-r*.43,a.y);ctx.closePath();ctx.fill();ctx.restore();label('?',a.x,a.y-r*.7,Math.max(15,S*.55),'#ffeac3');label(p.label,a.x,a.y-r*2.25,Math.max(9,S*.24),'#fff')}function kiosk(p){const a=iso(p.x,p.y),r=S*.6;ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=near===p?24:12;diamond(a.x,a.y+8,r*1.35,'#39244e',p.color);ctx.shadowBlur=0;ctx.fillStyle='#7c568c';ctx.fillRect(a.x-r*.67,a.y-r*1.45,r*1.34,r*1.1);ctx.fillStyle=p.color;path([{x:a.x-r*.95,y:a.y-r*1.4},{x:a.x,y:a.y-r*2.15},{x:a.x+r*.95,y:a.y-r*1.4}],p.color,'#fff0c0',2);ctx.restore();label(({shop:'🛍',board:'🏆',daily:'📜',events:'🎉'})[p.id],a.x,a.y-r*.58,Math.max(15,S*.48));label(p.label,a.x,a.y-r*2.45,Math.max(9,S*.22),'#fff')}function bin(p){const a=iso(p.x,p.y);ctx.fillStyle='#202c37';ctx.fillRect(a.x-11,a.y-22,22,24);ctx.fillStyle='#8bd9a9';ctx.fillRect(a.x-14,a.y-25,28,6);ctx.fillStyle='#9bc3ae';ctx.fillRect(a.x-7,a.y-17,3,13);ctx.fillRect(a.x+4,a.y-17,3,13);if(near===p)label('🦝 ?',a.x,a.y-32,15)}function crown(){const a=iso(0,0);ctx.save();ctx.shadowColor='#ffd16d';ctx.shadowBlur=18;ctx.beginPath();ctx.ellipse(a.x,a.y,S*1.7,S*.86,0,0,Math.PI*2);ctx.fillStyle='#4b2c6b';ctx.fill();ctx.strokeStyle='#f9d77d';ctx.lineWidth=5;ctx.stroke();ctx.beginPath();ctx.ellipse(a.x,a.y,S*1.3,S*.64,0,0,Math.PI*2);ctx.strokeStyle='#a875ef';ctx.lineWidth=3;ctx.stroke();ctx.restore();label('♛',a.x,a.y+S*.23,Math.max(26,S*1.05),'#ffe28d');label('THE CROWN',a.x,a.y+S*1.25,Math.max(9,S*.24),'#ffe4a3')}
function draw(){const bg=ctx.createRadialGradient(W*.5,H*.35,10,W*.5,H*.45,Math.max(W,H)*.8);bg.addColorStop(0,'#48306e');bg.addColorStop(.55,'#1a1339');bg.addColorStop(1,'#080a1e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(0,0);const corners=[iso(-8,-8),iso(8,-8),iso(8,8),iso(-8,8)];path(corners,'#39234e','#d8a86e',5);for(let n=-8;n<=8;n++){ctx.beginPath();let a=iso(n,-8),b=iso(n,8),c=iso(-8,n),d=iso(8,n);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.moveTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.strokeStyle='#caa1ff24';ctx.lineWidth=1;ctx.stroke()}wall({x:-8,y:-8},{x:8,y:-8},'#4e356b');wall({x:-8,y:-8},{x:-8,y:8},'#38244d');for(const p of locations.filter(x=>x.kind==='door'))portal(p);crown();for(const p of locations.filter(x=>x.kind==='feature'))kiosk(p);for(const p of locations.filter(x=>x.kind==='trash'))bin(p);const a=iso(pos.x,pos.y);ctx.save();ctx.shadowColor='#66eaff';ctx.shadowBlur=18;ctx.fillStyle='#47c8f5';ctx.beginPath();ctx.ellipse(a.x,a.y-13,10,17,0,0,7);ctx.fill();ctx.fillStyle='#ffe0bc';ctx.beginPath();ctx.arc(a.x,a.y-33,9,0,7);ctx.fill();ctx.restore();label('YOU',a.x,a.y-49,11,'#fff');ctx.restore()}
function tick(t){if(!last)last=t;const dt=Math.min((t-last)/1000,.05);last=t;if(!paused){let x=axis.x+Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),y=axis.y+Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));const m=Math.hypot(x,y);if(m>.06){x/=Math.max(1,m);y/=Math.max(1,m);const nx=pos.x+(x+y)*.707*dt*3.5,ny=pos.y+(y-x)*.707*dt*3.5;if(Math.abs(nx)<7.7&&Math.abs(ny)<7.7){pos.x=nx;pos.y=ny}}near=locations.reduce((best,p)=>{const d=Math.hypot(pos.x-p.x,pos.y-p.y);return d<1.5&&(!best||d<best.d)?{p,d}:best},null)?.p||null;action.disabled=!near;action.textContent=near?(near.kind==='door'?'OPEN':'USE'):'OPEN';toast.textContent=near?(near.kind==='door'?'A mystery door. Open to discover.':`Press USE: ${near.label}`):'Move with joystick • Explore the castle lobby'}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
function move(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.hypot(dx,dy),max=r.width*.33,f=Math.min(len,max)/(len||1);axis.x=dx*f/max;axis.y=dy*f/max;knob.style.transform=`translate(calc(-50% + ${dx*f}px),calc(-50% + ${dy*f}px))`}function reset(){active=null;axis.x=axis.y=0;knob.style.transform='translate(-50%,-50%)'}joy.addEventListener('pointerdown',e=>{e.preventDefault();active=e.pointerId;joy.setPointerCapture(active);move(e)});joy.addEventListener('pointermove',e=>{if(active===e.pointerId)move(e)});for(const event of ['pointerup','pointercancel','lostpointercapture'])joy.addEventListener(event,reset);addEventListener('blur',()=>{reset();keys.clear()});addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='Enter'||e.key===' ')interact();if(e.key==='Escape')close()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));function show(title,html){paused=true;reset();document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;modal.classList.add('show')}function close(){modal.classList.remove('show');paused=false}document.getElementById('close').addEventListener('click',close);
const demos={shop:['🛍️ The Shop','<p>Spend your Cheese on cosmetics, bookmarks, and lobby extras when the economy goes live.</p><div class="item"><strong>🎩 Avatar Cosmetics</strong><br>Preview catalogue — not purchasable yet.</div><div class="item"><strong>🔖 Game Bookmark</strong><br>Proposed: 1,000 Cheese.</div><div class="item"><strong>🏰 Private Lobby Pass</strong><br>Proposed: 1,000 Cheese / 30 days.</div>'],board:['🏆 All-Time Cheeseboard','<p>Future all-time Cheese leaderboard.</p><div class="item">🥇 Your name could go here!</div><p class="small">Demo only: no player accounts or leaderboard server connected.</p>'],daily:['📜 Daily Challenges','<p>Daily challenges will reward exploring, playing, and creating.</p><div class="item">🚪 Open a mystery corridor — prototype exploration</div><div class="item">🦝 Find Trash Panda — prototype interaction</div><p class="small">No daily reset or rewards are active in this demo.</p>'],events:['🎉 Events','<p>Limited-time community chaos, themed corridors, and special celebrations are planned.</p><div class="item">✨ Upcoming events will appear here.</div><p class="small">No live event schedule connected.</p>'],crown:['👑 The Crown','<p>The heart of the lobby. Gather here with friends.</p><div class="item">🧀 Cheese Room hatch: locked until a future legendary discovery.</div><p class="small">No fifth corridor. The hatch is beneath the crown.</p>']};
function interact(){if(paused||!near)return;if(near.kind==='door'){opened++;const troll=rand()<.16;const gags=['Back to the Lobby, Kid!','Say Cheese!','THIS CLOSE!!','NOT YOU!','Trash Panda 1, Kid 0'];if(troll){show('🦝 TRASH PANDA!',`<p>${gags[Math.floor(rand()*gags.length)]}</p><p>That raccoon got you this time.</p><p class="small">Prototype random troll gag. No real cooldown or legendary odds yet.</p>`)}else{show('🚪 MYSTERY OPENED',`<p>The door opens into swirling light...</p><p>🎲 In the full game, this reveals a random eligible game or rare room.</p><p class="small">This is a lobby interaction demo. No playable minigame, matchmaking, or account-tied cooldown is connected.</p>`)}return}if(near.kind==='trash'){trashOpened++;const surprise=trashOpened%3===0;show('🦝 TRASH PANDA',surprise?'<p>Trash Panda bursts out wearing brass goggles, a red scarf, and a tiny crown!</p><p>“WHO TOUCHED MY GARBAGE?!”</p>':'<p>The garbage can rattles... 👀</p><p>A pair of mischievous eyes peeks out, then vanishes.</p>');return}const d=demos[near.id];if(d)show(...d)}action.addEventListener('click',interact);document.getElementById('profile').addEventListener('click',()=>menu.classList.toggle('show'));menu.addEventListener('click',e=>{const id=e.target.dataset.menu;if(!id)return;menu.classList.remove('show');if(id==='profile')show('👤 Player Profile','<p>Guest explorer — local prototype.</p><p class="small">Accounts, avatar customization, and saved Cheese are not connected yet.</p>');if(id==='social')show('👥 Social Lobby','<p>Invite friends and gather with up to eight players in the planned multiplayer version.</p><p class="small">This build is single-player only; no networking is active.</p>');if(id==='help')show('🎮 Controls','<p>Drag the joystick on mobile or use WASD / arrow keys on desktop.</p><p>Walk near a glowing mystery corridor or a lobby station, then tap OPEN / USE.</p><p>Keyboard: Enter to interact, Escape to close.</p>')});})();
</script></body></html>
